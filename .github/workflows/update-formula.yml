name: Update Formula

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Fetch latest release info
        id: release
        run: |
          RELEASE=$(curl -sSfL https://api.github.com/repos/Entytaiment25/meowping/releases/latest)
          VERSION=$(echo "$RELEASE" | jq -r '.tag_name')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to fetch latest release version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute checksums
        id: checksums
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          BASE="https://github.com/Entytaiment25/meowping/releases/download/${VERSION}"

          AARCH64_URL="${BASE}/meowping-${VERSION}-aarch64-apple-darwin.tar.gz"
          X86_64_URL="${BASE}/meowping-${VERSION}-x86_64-apple-darwin.tar.gz"

          AARCH64_SHA=$(curl -sSfL "$AARCH64_URL" | sha256sum | awk '{print $1}')
          X86_64_SHA=$(curl -sSfL "$X86_64_URL" | sha256sum | awk '{print $1}')

          if [ -z "$AARCH64_SHA" ] || [ -z "$X86_64_SHA" ]; then
            echo "Failed to compute checksums for release assets" >&2
            exit 1
          fi

          echo "aarch64_url=$AARCH64_URL" >> "$GITHUB_OUTPUT"
          echo "x86_64_url=$X86_64_URL" >> "$GITHUB_OUTPUT"
          echo "aarch64_sha=$AARCH64_SHA" >> "$GITHUB_OUTPUT"
          echo "x86_64_sha=$X86_64_SHA" >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          AARCH64_URL="${{ steps.checksums.outputs.aarch64_url }}"
          X86_64_URL="${{ steps.checksums.outputs.x86_64_url }}"
          AARCH64_SHA="${{ steps.checksums.outputs.aarch64_sha }}"
          X86_64_SHA="${{ steps.checksums.outputs.x86_64_sha }}"

          sed -i "s|version \".*\"|version \"${VERSION}\"|" Formula/meowping.rb
          sed -i "s|url \"https://github.com/Entytaiment25/meowping/releases/download/.*/meowping-.*-aarch64-apple-darwin.tar.gz\"|url \"${AARCH64_URL}\"|" Formula/meowping.rb
          sed -i "s|url \"https://github.com/Entytaiment25/meowping/releases/download/.*/meowping-.*-x86_64-apple-darwin.tar.gz\"|url \"${X86_64_URL}\"|" Formula/meowping.rb
          sed -i "/aarch64-apple-darwin/{n;s|sha256 \".*\"|sha256 \"${AARCH64_SHA}\"|};" Formula/meowping.rb
          sed -i "/x86_64-apple-darwin/{n;s|sha256 \".*\"|sha256 \"${X86_64_SHA}\"|};" Formula/meowping.rb

      - name: Commit and push
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/meowping.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update meowping to ${VERSION}"
          git push
